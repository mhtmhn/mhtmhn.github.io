<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; connect-src https://claude-status.mohitsandroid.workers.dev https://*.ably.io https://*.ably.net https://*.ably-realtime.com wss://*.ably.io wss://*.ably.net wss://*.ably-realtime.com; base-uri 'none'; form-action 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CC Status">
<title>Claude Status</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="app.css?v=3.3">
</head>
<body class="idle">
<main>
  <header>
    <img src="icons/icon-192.png" alt="" class="logo">
    <h1>Claude Status</h1>
    <span id="conn" class="conn" title="Connection"></span>
  </header>

  <!-- Shown until paired. -->
  <section id="welcome" class="card" hidden>
    <h2>Pair with Claude Code</h2>
    <p>In a Claude Code session on your computer, run <code>/ccstatus</code>, then scan the QR code it shows with your camera.</p>
  </section>

  <!-- Notifications, until they are on. -->
  <section id="notify" class="card notice" hidden>
    <p id="notifyText"></p>
    <button id="notifyBtn" type="button" class="primary" hidden>Turn on notifications</button>
  </section>

  <!-- One row per session, when there is more than one. -->
  <nav id="list"></nav>

  <!-- The followed session. -->
  <section id="view" hidden>
    <div class="hero">
      <div class="dot"></div>
      <div>
        <h2 id="label" class="label"></h2>
        <div id="meta" class="dim"></div>
      </div>
    </div>
    <div class="pill" id="pill" hidden><span class="ic" id="pic"></span><span class="verb" id="pverb"></span><span class="tgt" id="ptgt"></span></div>
    <p id="detail" class="dim"></p>
    <section class="card" id="summary" hidden>
      <h3>What you need to do</h3>
      <p id="stext"></p>
    </section>
  </section>

  <p id="empty" class="dim center" hidden>No session has reported yet. Start Claude Code on your computer.</p>
  <p id="problem" class="problem" hidden></p>

  <footer>
    <button id="version" type="button" class="link"></button>
  </footer>

  <!-- Diagnostics: five taps on the version. Nothing here leaves the phone. -->
  <section id="diag" class="card" hidden>
    <h3>Diagnostics</h3>
    <ol id="log"></ol>
    <button id="unpair" type="button" class="danger">Unpair this phone</button>
  </section>
</main>

<!-- The install sheet: iOS has no install API, so it shows the steps. -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-body" role="dialog" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle">Install the app</h2>
      <button id="sheetClose" type="button" class="x" aria-label="Close">✕</button>
    </div>
    <div class="app-card">
      <img src="icons/icon-192.png" alt="">
      <div><b>Claude Status</b><span>mohitmohan.com</span></div>
    </div>
    <ol id="steps" class="steps"></ol>
    <button id="installBtn" type="button" class="primary" hidden>Install</button>
  </div>
</div>

<script src="vendor/ably-2.29.0.min.js"></script>
<script src="vendor/ably-push-2.29.0.min.js"></script>
<script src="icons.js?v=3.2"></script>
<script src="crypt.js?v=3"></script>
<script src="app.js?v=3.3"></script>
</body>
</html>
